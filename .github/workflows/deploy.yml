name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 6 hours so the tokenomics scorecards carry fresh market figures (src/_data/market.js).
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # base_path is "/<repo>" on <account>.github.io/<repo>/ and empty on a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npx eleventy
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          # A scheduled run that can't reach CoinGecko fails, so the live site keeps its last good figures.
          MARKET_REQUIRED: ${{ github.event_name == 'schedule' && '1' || '' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
